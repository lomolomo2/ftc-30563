<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Computer Basics for Gamers and FTC Robotics</title>
  <style>
    :root {
      color-scheme: dark;
      --bg0: #07091a;
      --bg1: #0d1230;
      --bg2: #141a3f;
      --panel: rgba(15, 22, 53, 0.78);
      --panel-strong: rgba(22, 30, 70, 0.92);
      --line: rgba(167, 221, 255, 0.18);
      --text: #f4f7ff;
      --muted: #bac4df;
      --soft: #8f9cc0;
      --cyan: #54f0ff;
      --violet: #a779ff;
      --pink: #ff5dc8;
      --lime: #9dff7a;
      --gold: #ffd166;
      --danger: #ff7070;
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.38);
      --nav-width: 280px;
      --topbar: 58px;
      --radius: 8px;
      --font-title: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
      --font-body: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-code: "Cascadia Code", "JetBrains Mono", "Fira Code", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg0);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: var(--font-body);
      line-height: 1.62;
      background:
        radial-gradient(circle at 12% 8%, rgba(84, 240, 255, 0.18), transparent 28rem),
        radial-gradient(circle at 86% 14%, rgba(255, 93, 200, 0.13), transparent 26rem),
        radial-gradient(circle at 70% 70%, rgba(157, 255, 122, 0.08), transparent 23rem),
        linear-gradient(145deg, var(--bg0), var(--bg1) 45%, #10081e);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -2;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent 80%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      opacity: 0.26;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.04), rgba(255,255,255,0.04) 1px, transparent 1px, transparent 5px);
      mix-blend-mode: overlay;
    }

    button, input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    a {
      color: inherit;
    }

    .topbar {
      position: fixed;
      inset: 0 0 auto 0;
      height: var(--topbar);
      z-index: 50;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(7, 9, 26, 0.84);
      backdrop-filter: blur(18px);
    }

    .menu-btn, .share-btn, .nav-arrow, .copy-btn, .answer-btn, .start-btn {
      border: 1px solid rgba(84, 240, 255, 0.34);
      background: linear-gradient(180deg, rgba(84, 240, 255, 0.16), rgba(167, 121, 255, 0.1));
      border-radius: var(--radius);
      min-height: 38px;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .menu-btn:hover, .share-btn:hover, .nav-arrow:hover, .copy-btn:hover, .answer-btn:hover, .start-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(84, 240, 255, 0.8);
      box-shadow: 0 10px 26px rgba(84, 240, 255, 0.12);
    }

    .menu-btn {
      display: none;
      width: 42px;
      padding: 0;
      font-size: 1.2rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-family: var(--font-title);
      font-weight: 900;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 8px;
      background: conic-gradient(from 140deg, var(--cyan), var(--violet), var(--pink), var(--lime), var(--cyan));
      color: #07101d;
      box-shadow: 0 0 26px rgba(84, 240, 255, 0.22);
    }

    .progress-wrap {
      display: grid;
      grid-template-columns: minmax(120px, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .progress-track {
      width: 100%;
      height: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    }

    .progress-fill {
      width: 3.33%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink));
      box-shadow: 0 0 18px rgba(84, 240, 255, 0.7);
      transition: width 220ms ease;
    }

    .progress-label {
      color: var(--muted);
      font-family: var(--font-code);
      font-size: 0.86rem;
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .share-btn {
      padding: 0 13px;
      color: var(--text);
    }

    .side-nav {
      position: fixed;
      z-index: 45;
      left: 0;
      top: var(--topbar);
      bottom: 0;
      width: var(--nav-width);
      padding: 18px 12px 24px;
      overflow-y: auto;
      border-right: 1px solid var(--line);
      background: rgba(7, 9, 26, 0.72);
      backdrop-filter: blur(18px);
    }

    .nav-title {
      color: var(--soft);
      font-family: var(--font-code);
      font-size: 0.78rem;
      margin: 0 8px 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .toc {
      display: grid;
      gap: 4px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .toc button {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 8px;
      align-items: center;
      min-height: 38px;
      padding: 7px 8px;
      text-align: left;
      line-height: 1.22;
      font-size: 0.88rem;
    }

    .toc button:hover {
      background: rgba(255,255,255,0.06);
      color: var(--text);
    }

    .toc button.active {
      border-color: rgba(84, 240, 255, 0.38);
      background: linear-gradient(90deg, rgba(84,240,255,0.16), rgba(255,93,200,0.08));
      color: var(--text);
    }

    .toc-num {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 26px;
      border-radius: 7px;
      color: #07101d;
      background: var(--cyan);
      font-family: var(--font-code);
      font-weight: 900;
      font-size: 0.76rem;
    }

    .main {
      margin-left: var(--nav-width);
      padding-top: var(--topbar);
    }

    .lesson-section {
      min-height: calc(100svh - var(--topbar));
      position: relative;
      display: grid;
      align-items: center;
      padding: clamp(28px, 5vw, 72px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      overflow: hidden;
      scroll-margin-top: var(--topbar);
    }

    .lesson-section::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at var(--x, 72%) var(--y, 26%), color-mix(in srgb, var(--accent) 28%, transparent), transparent 26rem),
        linear-gradient(125deg, rgba(255,255,255,0.025), transparent 45%);
      opacity: 0.9;
    }

    .lesson-section::after {
      content: attr(data-icon);
      position: absolute;
      right: clamp(12px, 5vw, 74px);
      bottom: clamp(4px, 6vw, 58px);
      z-index: -1;
      font-size: clamp(5rem, 15vw, 15rem);
      line-height: 1;
      opacity: 0.085;
      filter: saturate(1.4);
    }

    .section-inner {
      width: min(1120px, 100%);
      margin: 0 auto;
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 520ms ease, transform 520ms ease;
    }

    .lesson-section.in-view .section-inner {
      opacity: 1;
      transform: translateY(0);
    }

    .kicker {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-family: var(--font-code);
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    .part-pill {
      border: 1px solid color-mix(in srgb, var(--accent) 48%, transparent);
      border-radius: 999px;
      padding: 4px 10px;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, transparent);
    }

    h1, h2, h3 {
      font-family: var(--font-title);
      line-height: 1.04;
      letter-spacing: 0;
      margin: 0;
    }

    h1 {
      max-width: 980px;
      font-size: clamp(3.3rem, 8vw, 7.8rem);
      text-transform: uppercase;
      text-wrap: balance;
      text-shadow: 0 0 34px color-mix(in srgb, var(--accent) 24%, transparent);
    }

    h2 {
      max-width: 940px;
      font-size: clamp(2.3rem, 5.2vw, 5.6rem);
      text-wrap: balance;
    }

    h3 {
      font-size: clamp(1.12rem, 2vw, 1.55rem);
      margin-bottom: 8px;
      color: var(--text);
    }

    .subtitle {
      max-width: 770px;
      color: var(--muted);
      font-size: clamp(1.13rem, 2vw, 1.4rem);
      margin: 18px 0 0;
      text-wrap: balance;
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.04fr) minmax(320px, 0.74fr);
      gap: clamp(18px, 3vw, 34px);
      align-items: start;
      margin-top: clamp(22px, 4vw, 42px);
    }

    .concept-stack {
      display: grid;
      gap: 16px;
      min-width: 0;
    }

    .block {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: clamp(16px, 2.4vw, 24px);
      background: linear-gradient(180deg, rgba(255,255,255,0.075), rgba(255,255,255,0.038));
      box-shadow: var(--shadow);
    }

    .hook {
      border-color: color-mix(in srgb, var(--accent) 42%, transparent);
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--accent) 15%, transparent), rgba(255,255,255,0.042)),
        rgba(255,255,255,0.04);
    }

    .hook p, .block p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(1.02rem, 1.55vw, 1.15rem);
    }

    .hook p strong, .block p strong, .highlight {
      color: var(--text);
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 24%, transparent), rgba(255,255,255,0));
      border-radius: 5px;
      padding: 1px 5px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .takeaway {
      position: relative;
      overflow: hidden;
      border-color: color-mix(in srgb, var(--accent) 58%, transparent);
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--accent) 22%, transparent), rgba(255,255,255,0.055)),
        rgba(255,255,255,0.05);
    }

    .takeaway::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--accent);
      box-shadow: 0 0 22px var(--accent);
    }

    .takeaway p {
      color: var(--text);
      font-weight: 750;
      padding-left: 10px;
    }

    .example-panel {
      display: grid;
      gap: 16px;
      min-width: 0;
    }

    .visual {
      min-height: 190px;
      border: 1px solid color-mix(in srgb, var(--accent) 36%, transparent);
      border-radius: var(--radius);
      background:
        linear-gradient(160deg, color-mix(in srgb, var(--accent) 14%, transparent), rgba(255,255,255,0.045)),
        rgba(8, 12, 32, 0.66);
      box-shadow: var(--shadow);
      padding: 18px;
      position: relative;
      overflow: hidden;
    }

    .visual-title {
      font-family: var(--font-code);
      color: var(--accent);
      font-size: 0.86rem;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .chip-row, .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 999px;
      padding: 7px 10px;
      color: var(--text);
      background: rgba(255,255,255,0.07);
      font-weight: 700;
      font-size: 0.92rem;
    }

    .flow {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      align-items: stretch;
      margin-top: 12px;
    }

    .flow div {
      min-height: 74px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 8px;
      background: rgba(255,255,255,0.055);
      font-weight: 800;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .stat {
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 12px;
      background: rgba(255,255,255,0.055);
    }

    .stat strong {
      display: block;
      color: var(--accent);
      font-family: var(--font-code);
      font-size: 0.86rem;
    }

    .stat span {
      color: var(--muted);
      font-size: 0.94rem;
    }

    .code-card {
      border: 1px solid rgba(84, 240, 255, 0.22);
      border-radius: var(--radius);
      background: #070b18;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .code-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 9px 10px 9px 14px;
      background: linear-gradient(90deg, rgba(84,240,255,0.13), rgba(167,121,255,0.08));
      border-bottom: 1px solid rgba(255,255,255,0.1);
      color: var(--muted);
      font-family: var(--font-code);
      font-size: 0.82rem;
    }

    .copy-btn {
      min-height: 30px;
      padding: 0 10px;
      font-size: 0.78rem;
      font-family: var(--font-code);
    }

    pre {
      margin: 0;
      padding: 15px;
      overflow-x: auto;
      font-family: var(--font-code);
      font-size: clamp(0.78rem, 1.35vw, 0.92rem);
      line-height: 1.58;
      color: #e8edff;
      tab-size: 2;
    }

    .tok-key { color: #ff8bd9; font-weight: 800; }
    .tok-type { color: #64efff; font-weight: 800; }
    .tok-str { color: #ffe083; }
    .tok-num { color: #9dff7a; }
    .tok-comment { color: #7890ad; font-style: italic; }
    .tok-ann { color: #c99cff; font-weight: 800; }

    details.ai-card {
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.055);
      overflow: hidden;
    }

    details.ai-card[open] {
      background: rgba(255,255,255,0.075);
    }

    .ai-card summary {
      list-style: none;
      cursor: pointer;
      padding: 14px 16px;
      font-weight: 900;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .ai-card summary::-webkit-details-marker {
      display: none;
    }

    .ai-card summary::after {
      content: "+";
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      color: var(--accent);
      font-family: var(--font-code);
    }

    .ai-card[open] summary::after {
      content: "-";
    }

    .ai-body {
      padding: 0 16px 16px;
      display: grid;
      gap: 12px;
    }

    .prompt-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .prompt {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
      border: 1px solid rgba(255,255,255,0.11);
      border-radius: 8px;
      padding: 10px;
      background: rgba(0,0,0,0.2);
      color: var(--muted);
      font-size: 0.94rem;
    }

    .tag {
      border: 1px solid color-mix(in srgb, var(--accent) 36%, transparent);
      border-radius: 999px;
      padding: 6px 9px;
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      color: var(--text);
      cursor: pointer;
      font-size: 0.86rem;
      font-weight: 750;
    }

    .tag:hover {
      border-color: var(--accent);
    }

    .nav-arrows {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 55;
      display: flex;
      gap: 8px;
    }

    .nav-arrow {
      width: 46px;
      height: 46px;
      font-size: 1.3rem;
      background: rgba(7, 9, 26, 0.78);
      backdrop-filter: blur(10px);
    }

    .start-btn {
      margin-top: 26px;
      min-height: 50px;
      padding: 0 22px;
      border-color: color-mix(in srgb, var(--accent) 72%, white 12%);
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 38%, #10162e), rgba(255,93,200,0.24));
      color: var(--text);
      font-weight: 950;
      font-size: 1.02rem;
    }

    .hero-orbit {
      width: min(560px, 100%);
      aspect-ratio: 1;
      margin: 0 auto;
      position: relative;
      display: grid;
      place-items: center;
    }

    .core-cube {
      width: 38%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 2px solid rgba(84,240,255,0.6);
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(84,240,255,0.18), rgba(255,93,200,0.12));
      box-shadow: 0 0 60px rgba(84,240,255,0.22), inset 0 0 28px rgba(255,255,255,0.08);
      font-size: clamp(3rem, 8vw, 5rem);
      animation: floaty 5s ease-in-out infinite;
    }

    .orbit-item {
      position: absolute;
      width: 94px;
      height: 94px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.075);
      box-shadow: var(--shadow);
      font-size: 2.15rem;
    }

    .orbit-item:nth-child(2) { top: 5%; left: 40%; }
    .orbit-item:nth-child(3) { top: 38%; right: 2%; }
    .orbit-item:nth-child(4) { bottom: 7%; left: 48%; }
    .orbit-item:nth-child(5) { top: 42%; left: 2%; }

    @keyframes floaty {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }

    .loop-viz {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
      position: relative;
    }

    .loop-step {
      min-height: 82px;
      display: grid;
      place-items: center;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px;
      background: rgba(255,255,255,0.055);
      font-weight: 850;
      transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
    }

    .loop-step.active {
      background: color-mix(in srgb, var(--accent) 20%, rgba(255,255,255,0.055));
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 30%, transparent);
    }

    .bot-track {
      margin-top: 18px;
      height: 44px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      background: rgba(0,0,0,0.24);
      position: relative;
      overflow: hidden;
    }

    .bot {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--accent);
      color: #07101d;
      transition: transform 280ms ease;
    }

    .challenge-board {
      display: grid;
      gap: 12px;
    }

    .challenge {
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 8px;
      padding: 13px;
      background: rgba(255,255,255,0.055);
    }

    .challenge p {
      margin: 0 0 10px;
      color: var(--text);
      font-weight: 760;
    }

    .challenge-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
    }

    .challenge input {
      width: 100%;
      min-height: 40px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 8px;
      background: rgba(0,0,0,0.25);
      color: var(--text);
      padding: 0 10px;
    }

    .answer-btn {
      padding: 0 11px;
      min-height: 40px;
    }

    .feedback {
      min-height: 24px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeCode(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function highlightJava(code) {
      const keywords = new Set(["public", "private", "protected", "class", "extends", "implements", "new", "if", "else", "while", "for", "return", "void", "double", "int", "boolean", "String", "true", "false", "final", "static", "import", "package"]);
      const types = new Set(["DcMotor", "Servo", "ColorSensor", "DistanceSensor", "IMU", "OpMode", "LinearOpMode", "TeleOp", "Autonomous", "DistanceUnit", "AngleUnit", "Override", "hardwareMap", "telemetry", "gamepad1", "gamepad2"]);
      return escapeCode(code).replace(/\/\/.*|"(?:\\.|[^"\\])*"|@[A-Za-z_][A-Za-z0-9_]*|\b-?\d+(?:\.\d+)?\b|\b[A-Za-z_][A-Za-z0-9_]*\b/g, token => {
        if (token.startsWith("//")) return `<span class="tok-comment">${token}</span>`;
        if (token.startsWith("\"")) return `<span class="tok-str">${token}</span>`;
        if (token.startsWith("@")) return `<span class="tok-ann">${token}</span>`;
        if (/^-?\d/.test(token)) return `<span class="tok-num">${token}</span>`;
        if (keywords.has(token)) return `<span class="tok-key">${token}</span>`;
        if (types.has(token)) return `<span class="tok-type">${token}</span>`;
        return token;
      });
    }

    function copyText(text) {

        const temp = document.createElement("textarea");
        temp.value = text;
        temp.setAttribute("readonly", "");
        temp.style.position = "fixed";
        temp.style.left = "-9999px";
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        temp.remove();
        showToast("Copied");
      }
    }

      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.target.matches("input, textarea")) return;
      if (event.key === "ArrowDown") {
        event.preventDefault();
        goToSection(currentIndex + 1);
      }
      if (event.key === "ArrowUp") {
        event.preventDefault();
        goToSection(currentIndex - 1);
      }
    });

    let loopStep = 0;
    setInterval(() => {
      const loopViz = document.getElementById("loopViz");
      const bot = document.getElementById("loopBot");
      if (!loopViz || !bot) return;
      const steps = Array.from(loopViz.querySelectorAll(".loop-step"));
      steps.forEach((step, index) => step.classList.toggle("active", index === loopStep));
      const trackWidth = bot.parentElement.clientWidth - bot.clientWidth - 8;
      bot.style.transform = `translateX(${(trackWidth / 2) * loopStep}px)`;
      loopStep = (loopStep + 1) % steps.length;
    }, 900);

    updateProgress(0);
    sections[0].classList.add("in-view");
  </script>
</body>
</html>
